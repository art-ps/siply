name: Siply
options:
  bundleIdPrefix: info.pisarev
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Siply:
    type: application
    platform: macOS
    sources: [Siply]
    info:
      path: Siply/Info.plist
      properties:
        CFBundleDisplayName: Siply
        CFBundleShortVersionString: "1.2.1"
        CFBundleVersion: "5"
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: ""
        NSAccentColorName: AccentColor
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.mp3
              - public.mpeg-4-audio
              - public.aac-audio
              - org.xiph.flac
              - com.microsoft.waveform-audio
              - public.aiff-audio
              - public.aifc-audio
              - com.apple.coreaudio-format
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.pisarev.siply
        PRODUCT_NAME: Siply
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SiplyTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SiplyTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Siply
schemes:
  Siply:
    build:
      targets:
        Siply: all
        SiplyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SiplyTests]
